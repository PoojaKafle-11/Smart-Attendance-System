{% extends 'base.html' %}

{% block title %}
Edit Student | SmartAttend AI
{% endblock %}


{% block content %}

<div class="container py-5">

    <div class="mb-4">

        <a
            href="{% url 'students:student_list' %}"
            class="text-decoration-none"
        >
            ← Back to Students
        </a>

        <h2 class="fw-bold mt-3">
            Edit Student
        </h2>

        <p class="text-muted">
            Update student information.
        </p>

    </div>


    <div class="card border-0 shadow-sm">

        <div class="card-body p-4">

            <form
                method="POST"
                enctype="multipart/form-data"
            >

                {% csrf_token %}


                <div class="row g-4">


                    <div class="col-md-6">

                        <label class="form-label">
                            Student ID
                        </label>

                        <input
                            type="text"
                            name="student_id"
                            class="form-control"
                            value="{{ student.student_id }}"
                            required
                        >

                    </div>


                    <div class="col-md-6">

                        <label class="form-label">
                            Full Name
                        </label>

                        <input
                            type="text"
                            name="name"
                            class="form-control"
                            value="{{ student.name }}"
                            required
                        >

                    </div>


                    <div class="col-md-6">

                        <label class="form-label">
                            Email
                        </label>

                        <input
                            type="email"
                            name="email"
                            class="form-control"
                            value="{{ student.email }}"
                            required
                        >

                    </div>


                    <div class="col-md-6">

                        <label class="form-label">
                            Phone
                        </label>

                        <input
                            type="text"
                            name="phone"
                            class="form-control"
                            value="{{ student.phone }}"
                        >

                    </div>


                    <div class="col-md-6">

                        <label class="form-label">
                            Semester
                        </label>

                        <select
                            name="semester"
                            class="form-select"
                            required
                        >

                            {% for i in "12345678" %}

                            <option
                                value="{{ i }}"
                                {% if student.semester|stringformat:"s" == i %}
                                    selected
                                {% endif %}
                            >
                                Semester {{ i }}
                            </option>

                            {% endfor %}

                        </select>

                    </div>


                    <div class="col-md-6">

                        <label class="form-label">
                            Section
                        </label>

                        <select
                            name="section"
                            class="form-select"
                            required
                        >

                            <option
                                value="A"
                                {% if student.section == "A" %}
                                    selected
                                {% endif %}
                            >
                                Section A
                            </option>

                            <option
                                value="B"
                                {% if student.section == "B" %}
                                    selected
                                {% endif %}
                            >
                                Section B
                            </option>

                            <option
                                value="C"
                                {% if student.section == "C" %}
                                    selected
                                {% endif %}
                            >
                                Section C
                            </option>

                        </select>

                    </div>


                    <div class="col-12">

                        <label class="form-label">
                            Profile Photo
                        </label>

                        <input
                            type="file"
                            name="profile_photo"
                            class="form-control"
                            accept="image/*"
                        >

                    </div>


                    <div class="col-12">

                        <hr>

                        <button
                            type="submit"
                            class="btn btn-primary"
                        >
                            Save Changes
                        </button>

                        <a
                            href="{% url 'students:student_list' %}"
                            class="btn btn-light"
                        >
                            Cancel
                        </a>

                    </div>

                </div>

            </form>

        </div>

    </div>

</div>

{% endblock %}
